<text x="700" y="42" font-size="18" text-anchor="middle" font-weight="700" fill="#1e293b">스위치 GND 연결 확대도 — SW1 (KEY1) 예시</text>
<text x="700" y="64" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">SW2~SW4 도 열 번호만 다를 뿐 방식은 완전히 같다 (GND 쪽 신호 쪽 두 열에 각각 점퍼 하나씩).</text>
