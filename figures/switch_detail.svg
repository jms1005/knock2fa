<circle cx="1100" cy="402" r="5.4" fill="#16a34a"/>
<text x="985" y="432" font-size="10.5" text-anchor="middle" font-weight="700" fill="#16a34a">GND ↔ D2 연결됨</text>
<polyline points="870,224 870,150" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1100,224 1100,178 1190,178" fill="none" stroke="#0369a1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1196" y="182" font-size="12" text-anchor="start" font-weight="700" fill="#0369a1">→ Uno D2</text>
<rect x="840" y="444" width="290" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="985" y="466" font-size="13" text-anchor="middle" font-weight="700" fill="#16a34a">D2 = LOW  (눌림 감지됨)</text>
<text x="60" y="588" font-size="12.5" text-anchor="start" font-weight="700" fill="#b91c1c">확인 방법: 아무것도 안 눌렀을 때 이미 반응이 있다면 —</text>
<text x="60" y="608" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">배선이 틀린 게 아니라 스위치를 90도 돌려 꽂아야 하는 경우가 많다. 돌려서 다시 꽂고 그대로 테스트해 보면 된다.</text>
