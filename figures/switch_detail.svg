<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="1400" height="640" fill="#ffffff"/>
