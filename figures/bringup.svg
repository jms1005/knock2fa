<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" width="1560" height="820" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1560" height="820" fill="#ffffff"/>
<text x="780" y="40" font-size="20" text-anchor="middle" font-weight="700" fill="#1e293b">knock2fa — 브링업 순서 (README §9)</text>
<text x="780" y="62" font-size="12.5" text-anchor="middle" font-weight="400" fill="#64748b">한 번에 다 연결하지 말 것 — 아래 ①→⑥ 순서로 하나씩 붙이고, 각 단계를 확인한 뒤에만 다음으로 넘어간다.</text>
<rect x="50" y="110" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="84" cy="144" r="20" fill="#0f766e"/>
<text x="84" y="150" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="114" y="150" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">보드만</text>
<text x="74" y="184" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="110" y="184" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">부품 없음 — 빌드 + 업로드만</text>
<text x="74" y="214" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="110" y="214" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">OLED 없이도 UART(38400 8N1) 로</text>
<text x="74" y="234" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">헤더 줄이 나와야 한다.</text>
<rect x="540" y="110" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="574" cy="144" r="20" fill="#0f766e"/>
<text x="574" y="150" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="604" y="150" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">버튼 4개</text>
<text x="564" y="184" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="600" y="184" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">SW1~SW4 → PD2~PD5 (D2~D5)</text>
<text x="564" y="214" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="600" y="214" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">순서 입력 화면에서 '*' 가 누른</text>
<text x="564" y="234" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">만큼 찍히는지 확인.</text>
<text x="564" y="260" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">안 눌렀는데 이미 반응 있으면 →</text>
<text x="564" y="278" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">스위치를 90도 돌려 다시 꽂기</text>
<rect x="1030" y="110" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="1064" cy="144" r="20" fill="#0f766e"/>
<text x="1064" y="150" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="1094" y="150" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">OLED</text>
<text x="1054" y="184" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="1090" y="184" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">SSD1306 → PC4/PC5 (SDA/SCL)</text>
<text x="1054" y="214" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="1090" y="214" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">화면 전환이 되는지 확인.</text>
<text x="1054" y="240" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">안 나오면 → I2C 주소 0x3D 로</text>
<text x="1054" y="258" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">(ssd1306.h) 재시도</text>
<rect x="1030" y="460" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="1064" cy="494" r="20" fill="#0f766e"/>
<text x="1064" y="500" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
<text x="1094" y="500" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">피에조</text>
<text x="1054" y="534" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="1090" y="534" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">BZ1 + R3·R4 + D2·D3</text>
<text x="1054" y="564" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="1090" y="564" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">진행 표시 '*' 가 노크마다</text>
<text x="1054" y="584" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">하나씩 늘어나는지 확인.</text>
<text x="1054" y="610" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">1MΩ 블리드 저항(R4)부터 넣을 것</text>
<text x="1054" y="628" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">한 번 쳤는데 여러 번 잡히면 →</text>
<text x="1054" y="646" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">BLANK_TICKS(knock.c) 늘리기</text>
<text x="1054" y="664" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">노크가 아예 안 잡히면 → ICES1</text>
<text x="1054" y="682" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">(knock.c) 반전</text>
<rect x="540" y="460" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="574" cy="494" r="20" fill="#0f766e"/>
<text x="574" y="500" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<text x="604" y="500" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">등록 → 인증</text>
<text x="564" y="534" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="600" y="534" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">전체 흐름 (부품 추가 없음)</text>
<text x="564" y="564" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="600" y="564" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">등록 후 순서 + 리듬으로 GRANT</text>
<text x="564" y="584" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">까지 뜨는지 전체 확인.</text>
<rect x="50" y="460" width="460" height="260" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
<circle cx="84" cy="494" r="20" fill="#0f766e"/>
<text x="84" y="500" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
<text x="114" y="500" font-size="18" text-anchor="start" font-weight="700" fill="#1e293b">액추에이터</text>
<text x="74" y="534" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">연결</text>
<text x="110" y="534" font-size="12.5" text-anchor="start" font-weight="600" fill="#1e293b">PB1 → LED 먼저, 서보는 마지막</text>
<text x="74" y="564" font-size="12" text-anchor="start" font-weight="700" fill="#64748b">확인</text>
<text x="110" y="564" font-size="12" text-anchor="start" font-weight="400" fill="#1e293b">해제 시 HIGH 로 바뀌는지 확인.</text>
<text x="74" y="590" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">서보는 전류 소모로 보드가</text>
<text x="74" y="608" font-size="11.5" text-anchor="start" font-weight="700" fill="#b91c1c">리셋될 수 있어 가장 마지막에</text>
<polyline points="510,240 540,240" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="1000,240 1030,240" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="1260,370 1260,460" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="1030,590 1000,590" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="540,590 510,590" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="50" y="750" width="1460" height="46" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="70" y="778" font-size="12.5" text-anchor="start" font-weight="700" fill="#0f766e">UART 로그(38400 8N1)는 OLED가 죽어도 계속 나온다 — 각 단계에서 막히면 로그부터 확인할 것.</text>
</svg>