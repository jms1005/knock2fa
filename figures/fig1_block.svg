<text x="60" y="776" font-size="13.5" text-anchor="start" font-weight="700" fill="#7c3aed">핵심: 두 인증 계층이 서로 다른 주변장치에서 독립적으로 얻어지고, 두 결과가 같은 사용자를 가리켜야만 해제된다.</text>
<text x="60" y="802" font-size="13" text-anchor="start" font-weight="400" fill="#1e293b">따라서 버튼 순서가 노출되어도, 리듬을 흉내내도, 한쪽만으로는 잠금을 풀 수 없다.</text>
