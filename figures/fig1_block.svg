<text x="750" y="70" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">파란 테두리 = 하드웨어(주변장치) / 보라 테두리 = 소프트웨어</text>
<text x="150" y="118" font-size="14" text-anchor="middle" font-weight="700" fill="#64748b">입력</text>
